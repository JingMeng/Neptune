plugins { id 'com.android.library' version '8.2.1' }
repositories { google(); mavenCentral() }

dependencies {
    compileOnly 'androidx.annotation:annotation:1.7.1'
    compileOnly 'androidx.fragment:fragment:1.5.7'
    compileOnly 'androidx.appcompat:appcompat:1.6.1'
    compileOnly files('libs/android-26.jar')
    compileOnly files('libs/android-support-26.1.0.jar')
}


android {
    namespace 'org.qiyi.pluginlibrary'
    buildFeatures { aidl true }
    compileSdk 34

    lintOptions {
        abortOnError false
    }
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            resources.srcDirs = ['src']
            aidl.srcDirs = ['src']
            renderscript.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
            jniLibs.srcDirs = ['libs']
        }
    }
    defaultConfig {
        minSdk 14
        targetSdk 34
    }
    packagingOptions {
        exclude('META-INF/DEPENDENCIES')
        exclude('META-INF/NOTICE')
        exclude('META-INF/LICENSE')
    }
    lintOptions {
        // Or, if you prefer, you can continue to check for errors in release builds,
        checkReleaseBuilds false
        // but continue the build even when errors are found:
        abortOnError false
    }
}

